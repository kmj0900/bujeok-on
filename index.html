<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부적소동: 비밀 수련장</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>부적소동: 비밀 수련장</h1>
    <div id="hud"><span id="hud-p1"></span><span id="hud-time"></span><span id="hud-p2"></span></div>
    <canvas id="game" width="480" height="416"></canvas>
    <p id="help"><span>1P <kbd>W A S D</kbd> 이동 · <kbd>Space</kbd>/<kbd>Shift</kbd> 부적</span><span>2P <kbd>방향키</kbd> 이동 · <kbd>Enter</kbd> 부적</span><span><kbd>P</kbd>/<kbd>Esc</kbd> 일시정지 · <kbd>M</kbd> 소리</span></p>
    <div id="join-panel" hidden><label>방 코드 <input id="join-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false"></label><button id="join-btn" type="button">입장</button></div>
    <p id="status"></p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
