# Render 설정(Blueprint). 원본 정적 사이트(bujeok)와 별개의 새 Web Service로 배포한다.
services:
  - type: web
    name: bujeok-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: INPUT_DELAY
        value: "5"
